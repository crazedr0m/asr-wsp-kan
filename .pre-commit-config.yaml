# Pre-commit — быстрые проверки перед коммитом.
#
#   pre-commit install          # включить хуки
#   pre-commit run --all-files  # прогнать по всему репозиторию
#   pre-commit autoupdate       # обновить версии хуков
#
# Принцип «мягкого старта»: тяжёлые проверки (mypy, bandit) помечены
# `stages: [pre-push]` или запускаются вручную, чтобы не тормозить коммиты.
# Полный контур — `make check` и CI (см. docs/quality.md).

default_language_version:
  python: python3

repos:
  # --- Базовые гигиенические хуки -----------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(md|pdf)$
      - id: end-of-file-fixer
        exclude: \.(pdf|onnx|pt|pth|bin|rknn|safetensors)$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-ast
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # --- Ruff: линт + автофиксы ---------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # --- mypy: типизация (на pre-push, чтобы не тормозить коммиты) ----------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy (src + scripts)
        args: ["src", "scripts"]
        pass_filenames: false
        additional_dependencies:
          - types-PyYAML
        stages: [pre-push]

  # --- bandit: безопасность (на pre-push) ---------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src", "scripts"]
        pass_filenames: false
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-push]

  # --- detect-secrets: сканирование секретов ------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            .*\.lock|
            .*\.pdf|
            .*\.onnx|
            .*\.pt|
            .*\.rknn|
            .*\.safetensors
          )$

  # --- commitizen: проверка сообщения коммита (необязательный gate) -------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
