name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Отменяем предыдущие запуски для той же ветки/PR — экономим минуты CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Линт и форматирование (Ruff) — блокирующий: код уже приведён к норме.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Статическая типизация (mypy) — блокирующий: baseline зелёный.
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: mypy
        run: mypy src scripts

  # ---------------------------------------------------------------------------
  # Тесты и покрытие — блокирующий (порог покрытия задан в pyproject.toml).
  # ---------------------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: pytest (unit, без recognition/hardware)
        run: pytest tests/ -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Безопасность (bandit + pip-audit) — мягкий старт: не блокирует.
  # ---------------------------------------------------------------------------
  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install "bandit>=1.7" "pip-audit>=2.7"

      - name: bandit
        run: bandit -c pyproject.toml -r src scripts --severity-level medium

      - name: pip-audit
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------------------
  # Сложность и мейнтейнабилити — мягкий старт: не блокирует.
  # ---------------------------------------------------------------------------
  complexity:
    name: Complexity (xenon, vulture, interrogate)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install "xenon>=0.9" "vulture>=2.11" "interrogate>=1.7"

      - name: "xenon (baseline: E/C/B)"
        run: xenon --max-absolute E --max-modules C --max-average B src

      - name: vulture
        run: vulture src scripts --min-confidence 80

      - name: interrogate
        run: interrogate -c pyproject.toml src
